<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manhole Widget</title>
<link rel="stylesheet" href="shared/base.css" data-inline>
<style>
  #root {
    gap: 3cqmin;
  }

  :root.tilt #root > * {
    --depth: 0;
  }

  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }

  #overlay.hidden {
    display: none;
  }

  #overlay .box {
    padding: 3cqmin 6cqmin;
    border-radius: 4cqmin;
    background: var(--bg);
    box-shadow: 0 1cqmin 4cqmin rgba(0, 0, 0, 0.25);
  }

  :root[data-theme="transparent"] #overlay .box {
    background: rgba(0, 0, 0, 0.55);
  }

  #overlay .big {
    font-size: 9cqmin;
    font-weight: 600;
  }

  #overlay .small {
    font-size: 4.5cqmin;
    color: var(--muted);
  }

  @container (min-aspect-ratio: 3/2) {
    #root {
      padding: 4cqmin 7cqmin;
    }
  }

  /* Tile: the game screen is the whole widget, no title, hint or theme background. */
  :root.gw-tile header {
    display: none;
  }

  :root.gw-tile #root {
    padding: 0;
    background: transparent;
  }

  :root.gw-tile #root::before,
  :root.gw-tile #root::after {
    display: none;
  }
</style>
</head>
<body>
<div id="root">
  <header class="row">
    <span class="title">Manhole</span>
    <span id="best" class="label"></span>
  </header>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="overlay" class="hidden"><div class="box"><div class="big" id="msg-big"></div><div class="small" id="msg-small"></div></div></div>
  </div>
</div>

<script id="widget-config" type="application/json">{}</script>
<script src="shared/fonts.js" data-inline></script>
<script src="shared/icons.js" data-inline></script>
<script src="shared/runtime.js" data-inline></script>
<script src="shared/input.js" data-inline></script>
<script src="shared/sound.js" data-inline></script>
<script src="shared/gw.js" data-inline></script>
<script src="../skins/manhole-gallery/skin.js" data-inline></script>
<script>
// Manhole (Game & Watch, 1981). Rules of the original:
// - People walk along two walkways with two open manholes each, the top one left to right,
//   the bottom one right to left.
// - You hold the one lid under whichever manhole you choose: up, down, left and right pick it,
//   like the four buttons of the Gold version. On the touch screen, tap the manhole.
// - 1 point each time someone steps over the lid. Someone stepping into an open manhole is a miss.
// - At 300 points: with no misses, points count double until the next miss; otherwise the misses
//   are cleared. Three misses end the game.
// - The game gets faster as the score grows. Game B: more people at once.
(function () {
  var cfg = W.config({
    mode: 'a',          // a or b
    speed: 'normal',    // slow, normal or fast
    look: 'lcd',        // built-in drawings only: lcd (grey green LCD) or theme (the widget theme's colors)
    ghosts: true,       // show the faint unlit sprites behind the game, like the LCD's unlit segments
    color: false,       // false: greyscale screen, true: the skin's own colors
    duck: true,         // lower iiSU's background music while a game is being played
    sound: true,
    skin: 'gallery',    // gallery (Game & Watch Gallery sprites), none (built-in drawings) or the address of a skin JSON file
    outline: false      // show every segment's box and id, to make a skin
  });

  var D = GW.draw;
  var HOLE_X = [112, 208];           // left and right manholes, on both walkways
  var STREET_Y = [80, 158];          // where the walkers' feet are
  var XS = [16, 48, 80, 112, 144, 176, 208, 240, 272, 304];   // ten steps, holes on the 4th and 7th
  var FALL_FRAMES = 8;               // a fall plays as 8 frames: 4 falling, 4 splashing
  // Walkway 0 goes left to right, walkway 1 right to left. Holes: 0 top left, 1 top right,
  // 2 bottom left, 3 bottom right (street * 2 + side).
  var PATHS = [XS, XS.slice().reverse()];
  var PREFIX = ['u-', 'l-'];

  function holeAt(street, idx) {
    var x = PATHS[street][idx];
    var side = HOLE_X.indexOf(x);
    return side < 0 ? null : street * 2 + side;
  }

  // Button presses needed to move the lid from hole a to hole b.
  function cost(a, b) {
    return (a >> 1 !== b >> 1 ? 1 : 0) + (a % 2 !== b % 2 ? 1 : 0);
  }

  GW.run({
    id: 'manhole',
    title: 'Manhole',
    size: [320, 200],
    hud: { digits: [250, 6], misses: [30, 16] },

    segments: function (S) {
      S.print(function (c) {
        STREET_Y.forEach(function (y, street) {
          var edges = [0, HOLE_X[0] - 14, HOLE_X[0] + 14, HOLE_X[1] - 14, HOLE_X[1] + 14, 320];
          for (var i = 0; i < edges.length; i += 2) {
            D.rect(c, edges[i], y + 1, edges[i + 1] - edges[i], 4, 1);
          }
          // Doorways at both ends of each walkway.
          c.lineWidth = 2;
          c.strokeRect(-2, y - 36, 8, 36);
          c.strokeRect(314, y - 36, 8, 36);
        });
        // Water under the top holes' ledges and along the bottom.
        HOLE_X.forEach(function (x) {
          D.rect(c, x - 13, STREET_Y[0] + 39, 26, 3, 1);
          D.waves(c, x - 20, x + 20, STREET_Y[0] + 46, 1.2, 1.2);
        });
        D.waves(c, 0, 320, 197, 2, 1.5);
      });

      // Walkers at every step. Their cap brim shows which way they walk.
      PATHS.forEach(function (xs, street) {
        xs.forEach(function (x, idx) {
          S.seg(PREFIX[street] + idx, x - 12, STREET_Y[street] - 32, 24, 32, function (c) {
            D.figure(c, 12, 17, 30, { arms: 'wave', legs: idx % 2 ? 'walk1' : 'walk2', hat: 'cap', flip: street === 1 });
          });
        });
      });

      // The lid holder under each hole, and a walker falling in.
      [0, 1, 2, 3].forEach(function (h) {
        var x = HOLE_X[h % 2];
        var y = STREET_Y[h >> 1];
        S.seg('man-' + h, x - 16, y - 1, 32, 40, function (c) {
          D.rect(c, 2, 1, 28, 4, 1.5);
          D.figure(c, 16, 22, 34, { arms: 'up', legs: 'stand' });
        });
        for (var k = 0; k < FALL_FRAMES; k++) {
          (function (k) {
            if (k < 4) {
              // Tumbling down the hole.
              S.seg('fall-' + h + '-' + k, x - 13, y + 2 + k * 6, 26, 26, function (c) {
                D.figure(c, 13, 13, 24, { arms: 'up', legs: 'spread', rot: Math.PI * (0.5 + k / 3) });
              });
            } else {
              // The splash, getting smaller.
              var t = 1 - (k - 4) / 4;
              S.seg('fall-' + h + '-' + k, x - 13, y + 22, 26, 16, function (c) {
                D.poly(c, [[1, 16], [5, 16 - 10 * t], [9, 14], [13, 16 - 14 * t], [17, 14], [21, 16 - 10 * t], [25, 16]]);
              });
            }
          })(k);
        }
      });

      // Double points indicator.
      S.seg('double', 72, 7, 18, 18, function (c) {
        var pts = [];
        for (var i = 0; i < 10; i++) {
          var r = i % 2 ? 3.6 : 8.5;
          var a = -Math.PI / 2 + i * Math.PI / 5;
          pts.push([9 + Math.cos(a) * r, 9 + Math.sin(a) * r]);
        }
        D.poly(c, pts);
      });
    },

    missIcon: function (c, x, y) {
      D.figure(c, x, y, 13, { arms: 'up', legs: 'spread', rot: Math.PI });
    },

    create: function (api) {
      var lid = 0;
      var walkers = [];
      var sinceSpawn = 99;
      var fell = null;
      var double = false;
      var gameB = api.mode === 'b';

      // Future ticks at which a walker reaches a hole: [{ t, hole }].
      function arrivals(w) {
        var out = [];
        for (var i = w.idx + 1; i < XS.length; i++) {
          var h = holeAt(w.street, i);
          if (h !== null) {
            out.push({ t: i - w.idx, hole: h });
          }
        }
        return out;
      }

      function fits(cand) {
        var mine = arrivals(cand);
        return walkers.every(function (w) {
          return arrivals(w).every(function (a) {
            return mine.every(function (b) {
              return a.hole === b.hole || Math.abs(a.t - b.t) >= cost(a.hole, b.hole);
            });
          });
        });
      }

      function maxWalkers() {
        var s = api.score();
        return gameB ? Math.min(6, 2 + Math.floor(s / 20)) : Math.min(4, 1 + Math.floor(s / 25));
      }

      function setLid(street, side) {
        var h = street * 2 + side;
        if (h === lid) {
          return false;
        }
        lid = h;
        return true;
      }

      return {
        tick: function () {
          for (var i = 0; i < walkers.length; i++) {
            var w = walkers[i];
            w.idx++;
            if (w.idx >= XS.length) {
              walkers.splice(i--, 1);
              continue;
            }
            var h = holeAt(w.street, w.idx);
            if (h === null) {
              continue;
            }
            if (lid === h) {
              var before = api.addScore(double ? 2 : 1);
              if (before < 300 && api.score() >= 300) {
                if (api.misses() === 0) {
                  double = true;
                } else {
                  api.clearMisses();
                }
                api.freeze(1500);
              }
            } else {
              fell = h;
              double = false;
              walkers.splice(i, 1);
              api.miss();
              return;
            }
          }
          sinceSpawn++;
          if (walkers.length < maxWalkers() && sinceSpawn >= 2 && (walkers.length === 0 || Math.random() < (gameB ? 0.5 : 0.35))) {
            var street = Math.random() < 0.5 ? 0 : 1;
            var free = walkers.every(function (o) { return o.street !== street || o.idx > 1; });
            var cand = { street: street, idx: 0 };
            if (free && fits(cand)) {
              walkers.push(cand);
              sinceSpawn = 0;
            }
          }
        },
        move: function (dir) {
          var street = lid >> 1;
          var side = lid % 2;
          if (dir === 'up' || dir === 'down') {
            return setLid(dir === 'up' ? 0 : 1, side);
          }
          return setLid(street, dir === 'left' ? 0 : 1);
        },
        // Moves the lid to the hole nearest to the tap.
        tap: function (x, y) {
          var best = 0;
          var bestD = Infinity;
          [0, 1, 2, 3].forEach(function (h) {
            var c = api.center('man-' + h);
            var d = (c[0] - x) * (c[0] - x) + (c[1] - y) * (c[1] - y);
            if (d < bestD) {
              bestD = d;
              best = h;
            }
          });
          return setLid(best >> 1, best % 2);
        },
        auto: function () {
          var next = null;
          walkers.forEach(function (w) {
            var a = arrivals(w)[0];
            if (a && (!next || a.t < next.t)) {
              next = a;
            }
          });
          if (next) {
            lid = next.hole;
          }
        },
        render: function (on, blink, t) {
          on('man-' + lid);
          walkers.forEach(function (w) {
            on(PREFIX[w.street] + w.idx);
          });
          if (fell !== null) {
            on('fall-' + fell + '-' + Math.min(FALL_FRAMES - 1, Math.floor(t / 200)));
          }
          if (double) {
            on('double');
          }
        },
        interval: function (score) {
          return GW.pace(cfg, score, { slow: 600, normal: 480, fast: 380 });
        },
        afterMiss: function () {
          fell = null;
        }
      };
    }
  }, cfg);
})();
</script>
</body>
</html>
