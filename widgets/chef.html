<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Widget</title>
<link rel="stylesheet" href="shared/base.css" data-inline>
<style>
  #root {
    gap: 4cqmin;
  }

  :root.tilt #root > * {
    --depth: 0;
  }

  #scores {
    display: flex;
    gap: 5cqmin;
  }

  #score {
    display: none;
  }

  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2cqmin;
    text-align: center;
    pointer-events: none;
  }

  #overlay .big {
    font-size: 11cqmin;
    font-weight: 600;
  }

  #overlay .small {
    font-size: 5.5cqmin;
    color: var(--muted);
  }

  #overlay.hidden {
    display: none;
  }

  #overlay .box {
    padding: 3cqmin 6cqmin;
    border-radius: 4cqmin;
    background: var(--bg);
    box-shadow: 0 1cqmin 4cqmin rgba(0, 0, 0, 0.2);
  }

  :root[data-theme="transparent"] #overlay .box {
    background: rgba(0, 0, 0, 0.45);
  }

  @container (min-aspect-ratio: 3/2) {
    #root {
      padding: 5cqmin 8cqmin;
    }

    #score {
      display: inline;
    }
  }
</style>
</head>
<body>
<div id="root">
  <header class="row">
    <span class="title">Chef</span>
    <span id="scores" class="label"><span id="score">Score 0</span><span id="best">Best 0</span></span>
  </header>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="overlay"><div class="box"><div class="big" id="msg-big"></div><div class="small" id="msg-small"></div></div></div>
  </div>
</div>

<script id="widget-config" type="application/json">{}</script>
<script src="shared/fonts.js" data-inline></script>
<script src="shared/icons.js" data-inline></script>
<script src="shared/runtime.js" data-inline></script>
<script src="shared/input.js" data-inline></script>
<script src="shared/sound.js" data-inline></script>
<script>
(function () {
  // Game & Watch Chef: food flies over from the left in an arc. You move your
  // plate stack up and down so the top plate catches it at the right height.
  // Every catch eats one plate; an empty stack resets to four (dish served).
  // Three misses = over.
  //
  // --- ASSET SHEET ---------------------------------------------------------
  // All sizes are in grid cells. The grid is 20 x 10.
  // Every sprite is currently a dashed placeholder box drawn by drawAsset().
  // To add pixel art: draw inside the box passed to drawAsset, using name and
  // frame to pick the sprite.
  //
  //   name     size         frames / notes
  //   chef     2.6 x 2.4    the chef on the left who throws the food
  //   plate    1.8 x 0.7    one plate of the stack, drawn bottom to top
  //   hand     1.8 x 0.7    the plate currently at the top of the stack
  //   food     1.0 x 0.8    frames: 'sausage', 'fish', 'carrot', 'shrimp'
  //   counter  1.4 x 4.2    the counter the plates stand on, right side
  //   miss     0.9 x 0.9    one shown per miss (max 3), top right
  // -------------------------------------------------------------------------

  var cfg = W.config({
    speed: 'normal',   // slow, normal or fast
    sound: true
  });

  var TICKS = { slow: 72, normal: 56, fast: 42 };
  var COLS = 20, ROWS = 10;
  var PLATE_X = 16.2;      // where food is caught
  var STACK_X = 16.2;
  var BASE_Y = 8.0;        // bottom plate
  var PLATE_STEP = 1.5;    // height between stack levels
  var THROW_X = 0.8, THROW_Y = 6.4;
  var FOOD_VX = 0.8;
  var G = 0.16;
  var FOOD_W = 1.0, FOOD_H = 0.8;
  var FOOD_TYPES = ['sausage', 'fish', 'carrot', 'shrimp'];

  var BEST_KEY = 'chef:best';
  var canvas = W.$('board');
  var ctx = canvas.getContext('2d');

  var cell = 10, offX = 0, offY = 0;
  var foods = [];
  var stack = 4;
  var spawnTimer = 20;
  var score = 0;
  var misses = 0;
  var best = W.store.get(BEST_KEY) || 0;
  var state = 'ready';   // ready, playing, paused, over
  var lastTick = 0;
  var colors = {};

  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    colors.fg = cs.getPropertyValue('--fg').trim() || '#fff';
    colors.subtle = cs.getPropertyValue('--subtle').trim() || '#999';
  }

  function blip(f, d) {
    if (cfg.sound) {
      Sound.blip(f, d, 0.3);
    }
  }

  function layout() {
    var stage = W.$('stage');
    var w = stage.clientWidth;
    var h = stage.clientHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = Math.min(w / COLS, h / ROWS);
    offX = (w - cell * COLS) / 2;
    offY = (h - cell * ROWS) / 2;
    draw();
  }

  // Placeholder art. Replace the drawing inside with pixel art:
  // x, y, w, h are the sprite box in pixels, name picks the sprite,
  // frame picks the animation frame (null when the sprite has one frame).
  function drawAsset(name, gx, gy, gw, gh, frame) {
    var x = offX + gx * cell;
    var y = offY + gy * cell;
    var w = gw * cell;
    var h = gh * cell;
    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = colors.subtle;
    ctx.lineWidth = 1;
    ctx.setLineDash([Math.max(2, cell * 0.14)]);
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
    ctx.setLineDash([]);
    if (cell > 13) {
      ctx.fillStyle = colors.subtle;
      ctx.font = Math.max(6, cell * 0.2) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(frame ? name + ':' + frame : name, x + w / 2, y + h / 2);
    }
  }

  function stackTopY() {
    return BASE_Y - (stack - 1) * PLATE_STEP;
  }

  // Launch food aimed so it crosses the catch line at height level (1 to 4).
  function spawn() {
    var level = 1 + Math.floor(Math.random() * 4);
    var targetY = BASE_Y - (level - 1) * PLATE_STEP;
    var T = (PLATE_X - THROW_X) / FOOD_VX;
    var vy = (targetY - THROW_Y) / T - G * T / 2;
    foods.push({
      x: THROW_X,
      y: THROW_Y,
      vx: FOOD_VX,
      vy: vy,
      type: FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)]
    });
  }

  function addMiss() {
    misses++;
    blip(110, 0.35);
    if (misses >= 3) {
      if (score > best) {
        best = score;
        W.store.set(BEST_KEY, best);
      }
      setState('over');
    }
  }

  function tick() {
    for (var i = foods.length - 1; i >= 0; i--) {
      var f = foods[i];
      f.x += f.vx;
      f.vy += G;
      f.y += f.vy;
      if (f.x >= PLATE_X && f.x <= PLATE_X + FOOD_VX + 0.6) {
        if (Math.abs(f.y - stackTopY()) <= 1.1) {
          // Caught on the top plate.
          foods.splice(i, 1);
          score++;
          blip(880, 0.05);
          stack--;
          if (stack <= 0) {
            stack = 4;
            blip(1320, 0.09);
          }
          updateScores();
          continue;
        }
      }
      if (f.x > COLS + 0.5) {
        foods.splice(i, 1);
        addMiss();
      }
    }
    spawnTimer--;
    if (spawnTimer <= 0 && foods.length < 3 && state === 'playing') {
      spawn();
      spawnTimer = Math.max(12, 26 - score);
    }
  }

  function draw() {
    var w = canvas.width / (window.devicePixelRatio || 1);
    var h = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);

    // Scene.
    drawAsset('chef', 0, 4.4, 2.6, 2.4, null);
    drawAsset('counter', STACK_X - 0.4, 4.4, 1.4, 4.2, null);

    // The plate stack. Bottom to top; the top plate is the catch plate.
    for (var p = 0; p < stack; p++) {
      var py = BASE_Y - p * PLATE_STEP;
      var isTop = p === stack - 1;
      drawAsset(isTop ? 'hand' : 'plate', STACK_X, py, 1.8, 0.7, null);
    }

    // Food in the air.
    foods.forEach(function (f) {
      drawAsset('food', f.x, f.y, FOOD_W, FOOD_H, f.type);
    });

    // Misses, top right.
    for (var m = 0; m < misses; m++) {
      drawAsset('miss', COLS - 1.2 - m, 0.3, 0.9, 0.9, null);
    }
    ctx.globalAlpha = 1;
  }

  function updateScores() {
    W.$('score').textContent = 'Score ' + score;
    W.$('best').textContent = 'Best ' + best;
  }

  function setState(s) {
    state = s;
    var focused = Input.isFocusedView();
    var big = '';
    var small = '';
    if (!focused) {
      big = '';
      small = 'Focus to play';
    } else if (s === 'ready') {
      big = 'Chef';
      small = 'Press A or tap to start';
    } else if (s === 'paused') {
      big = 'Paused';
      small = 'Press A to continue';
    } else if (s === 'over') {
      big = 'Score ' + score;
      small = (score >= best && score > 0 ? 'New best! ' : '') + 'Press A to play again';
    }
    W.$('msg-big').textContent = big;
    W.$('msg-big').style.display = big ? '' : 'none';
    W.$('msg-small').textContent = small;
    W.$('overlay').classList.toggle('hidden', s === 'playing');
    updateScores();
  }

  function reset() {
    foods = [];
    stack = 4;
    score = 0;
    misses = 0;
    spawnTimer = 20;
    setState('ready');
  }

  function loop(t) {
    if (state === 'playing') {
      if (!Input.isFocusedView() || document.visibilityState !== 'visible') {
        setState('paused');
      } else if (t - lastTick >= TICKS[cfg.speed]) {
        lastTick = t;
        tick();
        draw();
      }
    }
    requestAnimationFrame(loop);
  }

  Input.on(function (a) {
    if (!Input.isFocusedView()) {
      return;
    }
    if (a.type === 'a') {
      if (state === 'over') {
        reset();
      }
      if (state !== 'playing') {
        setState('playing');
        lastTick = performance.now();
      }
    } else if (a.type === 'start') {
      setState(state === 'playing' ? 'paused' : 'playing');
    } else if (a.type === 'dir') {
      if (a.dir === 'up') {
        stack = Math.min(4, stack + 1);
      } else if (a.dir === 'down') {
        stack = Math.max(1, stack - 1);
      }
      if (state === 'ready') {
        setState('playing');
        lastTick = performance.now();
      }
    }
  });

  readColors();
  layout();
  setState('ready');
  window.addEventListener('resize', function () {
    layout();
    if (state !== 'playing') {
      setState(state);
    }
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(layout);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
