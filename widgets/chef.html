<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Widget</title>
<link rel="stylesheet" href="shared/base.css" data-inline>
<style>
  #root {
    gap: 3cqmin;
  }

  :root.tilt #root > * {
    --depth: 0;
  }

  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    pointer-events: none;
  }

  #overlay.hidden {
    display: none;
  }

  #overlay .box {
    padding: 3cqmin 6cqmin;
    border-radius: 4cqmin;
    background: var(--bg);
    box-shadow: 0 1cqmin 4cqmin rgba(0, 0, 0, 0.25);
  }

  :root[data-theme="transparent"] #overlay .box {
    background: rgba(0, 0, 0, 0.55);
  }

  #overlay .big {
    font-size: 9cqmin;
    font-weight: 600;
  }

  #overlay .small {
    font-size: 4.5cqmin;
    color: var(--muted);
  }

  @container (min-aspect-ratio: 3/2) {
    #root {
      padding: 4cqmin 7cqmin;
    }
  }

  /* Tile: the game screen is the whole widget, no title, hint or theme background. */
  :root.gw-tile header {
    display: none;
  }

  :root.gw-tile #root {
    padding: 0;
    background: transparent;
  }

  :root.gw-tile #root::before,
  :root.gw-tile #root::after {
    display: none;
  }
</style>
</head>
<body>
<div id="root">
  <header class="row">
    <span class="title">Chef</span>
    <span id="best" class="label"></span>
  </header>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="overlay" class="hidden"><div class="box"><div class="big" id="msg-big"></div><div class="small" id="msg-small"></div></div></div>
  </div>
</div>

<script id="widget-config" type="application/json">{}</script>
<script src="shared/fonts.js" data-inline></script>
<script src="shared/icons.js" data-inline></script>
<script src="shared/runtime.js" data-inline></script>
<script src="shared/input.js" data-inline></script>
<script src="shared/sound.js" data-inline></script>
<script src="shared/gw.js" data-inline></script>
<script src="../skins/chef-gallery/skin.js" data-inline></script>
<script>
// Chef (Game & Watch, 1981). Rules of the original:
// - The chef moves left and right under the food and flips it back up with his pan.
// - 1 point each time a piece of food lands in the pan.
// - Food that reaches the floor is eaten by a mouse: a miss. Three misses end the game.
// - The cat on the left sometimes spears the leftmost food with a fork and holds it for a moment,
//   which changes when it comes down.
// - At 200 and 500 points the misses are cleared. The game gets faster as the score grows.
// - Game A: three pieces of food. Game B: four.
(function () {
  var cfg = W.config({
    mode: 'a',          // a or b
    speed: 'normal',    // slow, normal or fast
    look: 'lcd',        // built-in drawings only: lcd (grey green LCD) or theme (the widget theme's colors)
    ghosts: true,       // show the faint unlit sprites behind the game, like the LCD's unlit segments
    color: false,       // false: greyscale screen, true: the skin's own colors
    duck: true,         // lower iiSU's background music while a game is being played
    sound: true,
    skin: 'gallery',    // gallery (Game & Watch Gallery sprites), none (built-in drawings) or the address of a skin JSON file
    outline: false      // show every segment's box and id, to make a skin
  });

  var D = GW.draw;
  var gameB = cfg.mode === 'b';
  var COLS = gameB ? [112, 162, 212, 262] : [124, 184, 244];
  var LEVELS = 6;                 // 0 (just above the pan) to 5 (top)
  var FORK_LEVEL = 3;

  function levelY(l) {
    return 144 - l * 21;
  }

  // The four foods: sausage, fish, drumstick, steak. Drawn around (0, 0).
  var FOODS = [
    function (c) {
      D.rect(c, -11, -4, 22, 8, 4);
      D.line(c, -12, 0, -14, 2, 1.5);
      D.line(c, 12, 0, 14, -2, 1.5);
    },
    function (c) {
      c.beginPath();
      c.ellipse(-2, 0, 9, 5, 0, 0, Math.PI * 2);
      c.fill();
      D.poly(c, [[6, 0], [13, -6], [13, 6]]);
    },
    function (c) {
      c.beginPath();
      c.ellipse(-4, 0, 8, 6, 0, 0, Math.PI * 2);
      c.fill();
      D.line(c, 3, 0, 10, 0, 3);
      D.circle(c, 11, -2, 2.2);
      D.circle(c, 11, 2, 2.2);
    },
    function (c) {
      D.poly(c, [[-11, -3], [-5, -7], [6, -6], [11, -1], [8, 6], [-4, 7], [-10, 4]]);
    }
  ];

  GW.run({
    id: 'chef',
    title: 'Chef',
    size: [320, 200],
    hud: { digits: [250, 6], misses: [84, 16] },

    segments: function (S) {
      S.print(function (c) {
        // Floor, the cat's shelf and a stove on the right.
        D.line(c, 0, 193, 320, 193, 2);
        D.rect(c, 4, 108, 56, 5, 1);
        D.line(c, 12, 113, 12, 130, 2);
        D.line(c, 52, 113, 52, 130, 2);
        c.lineWidth = 2;
        c.strokeRect(290, 150, 28, 43);
        D.rect(c, 288, 144, 32, 6, 1);
        D.circle(c, 297, 162, 2);
        D.circle(c, 310, 162, 2);
      });

      function drawCat(c) {
        c.beginPath();
        c.ellipse(24, 38, 17, 12, 0, 0, Math.PI * 2);
        c.fill();
        D.circle(c, 36, 20, 10);
        D.poly(c, [[28, 14], [30, 3], [36, 11]]);
        D.poly(c, [[37, 11], [43, 3], [45, 14]]);
        c.lineWidth = 4;
        c.beginPath();
        c.moveTo(8, 42);
        c.quadraticCurveTo(-2, 30, 6, 16);
        c.stroke();
      }

      // The cat sitting, and the cat while it holds food on its fork (the fork is its own segment).
      S.seg('cat', 6, 58, 52, 50, drawCat);
      S.seg('cat-grab', 6, 58, 52, 50, drawCat);

      var col0 = COLS[0];
      var forkY = levelY(FORK_LEVEL);
      S.seg('fork', 44, forkY - 8, col0 - 58, 16, function (c, w) {
        D.line(c, 0, 8, w - 6, 8, 3);
        D.line(c, w - 8, 3, w - 8, 13, 2);
        D.line(c, w - 8, 3, w, 3, 2);
        D.line(c, w - 8, 8, w, 8, 2);
        D.line(c, w - 8, 13, w, 13, 2);
      });

      COLS.forEach(function (x, col) {
        var draw = FOODS[col % FOODS.length];
        for (var l = 0; l < LEVELS; l++) {
          (function (rot) {
            S.seg('f-' + col + '-' + l, x - 14, levelY(l) - 10, 28, 20, function (c) {
              c.translate(14, 10);
              c.rotate(rot);
              draw(c);
            });
          })(l * 0.7 + col * 0.9);
        }
        S.seg('floor-' + col, x - 14, 180, 28, 12, function (c) {
          c.translate(14, 7);
          draw(c);
        });
        S.seg('mouse-' + col, x + 8, 178, 26, 15, function (c) {
          c.beginPath();
          c.ellipse(14, 10, 9, 5, 0, 0, Math.PI * 2);
          c.fill();
          D.circle(c, 5, 7, 3.5);
          D.circle(c, 5, 3, 2.5);
          D.line(c, 22, 11, 26, 6, 1.5);
        });
        S.seg('chef-' + col, x - 44, 124, 36, 70, function (c) {
          D.figure(c, 18, 46, 46, { arms: 'forward', legs: 'stand', hat: 'chef' });
        });
        S.seg('pan-' + col, x - 16, 150, 32, 14, function (c) {
          D.line(c, 0, 9, 7, 8, 2.5);
          c.beginPath();
          c.ellipse(18, 8, 12, 3.5, 0, 0, Math.PI * 2);
          c.fill();
        });
        S.seg('toss-' + col, x - 16, 144, 32, 20, function (c) {
          D.line(c, 0, 15, 7, 13, 2.5);
          c.save();
          c.translate(18, 9);
          c.rotate(-0.45);
          c.beginPath();
          c.ellipse(0, 0, 12, 3.5, 0, 0, Math.PI * 2);
          c.fill();
          c.restore();
        });
      });
    },

    missIcon: function (c, x, y) {
      c.beginPath();
      c.ellipse(x + 1, y + 2, 5, 3, 0, 0, Math.PI * 2);
      c.fill();
      D.circle(c, x - 4, y, 2.5);
      D.circle(c, x - 4, y - 3, 1.8);
    },

    create: function (api) {
      var chef = 1;
      var tossed = -1;
      var dropped = null;
      var catWait = 8;
      var order = COLS.map(function (x, i) { return i; }).sort(function () { return Math.random() - 0.5; });
      var foods = order.map(function (col, i) {
        return { col: col, level: 6 + i * 4, dir: -1, apex: 5, hang: 0, hangTop: 1, held: 0 };
      });

      // Ticks until a food next reaches the pan.
      function landing(f) {
        if (f.dir > 0) {
          return (f.apex - f.level) + f.hangTop + f.apex;
        }
        return f.held + f.hang + f.level;
      }

      // Smallest margin between a landing at time t in column col and the other foods' landings.
      // A margin below 0 means the chef cannot get to both in time.
      function margin(f, t) {
        var worst = 99;
        foods.forEach(function (o) {
          if (o !== f) {
            worst = Math.min(worst, Math.abs(landing(o) - t) - Math.abs(o.col - f.col));
          }
        });
        return worst;
      }

      // After a flip the food rises to a height from 3 to 5 and hangs there for 1 to 3 ticks.
      // Picks a flight whose landing leaves the chef time to reach every other landing.
      function pickFlight(f) {
        var tries = [];
        for (var a = 3; a <= 5; a++) {
          for (var hang = 1; hang <= 3; hang++) {
            tries.push({ a: a, hang: hang, m: margin(f, 2 * a + hang) });
          }
        }
        var ok = tries.filter(function (t) { return t.m >= 0; });
        if (ok.length) {
          return ok[Math.floor(Math.random() * ok.length)];
        }
        tries.sort(function (p, q) { return q.m - p.m; });
        return tries[0];
      }

      return {
        tick: function () {
          tossed = -1;
          var tossedFood = null;
          for (var i = 0; i < foods.length; i++) {
            var f = foods[i];
            if (f.held > 0) {
              f.held--;
              continue;
            }
            if (f.hang > 0) {
              f.hang--;
              continue;
            }
            if (f.dir > 0) {
              f.level++;
              if (f.level >= f.apex) {
                f.dir = -1;
                f.hang = f.hangTop;
              }
              continue;
            }
            f.level--;
            if (f.level === 0) {
              if (chef === f.col) {
                tossed = f.col;
                f.dir = 1;
                tossedFood = f;
                var before = api.addScore(1);
                if (before < 200 && api.score() >= 200 || before < 500 && api.score() >= 500) {
                  api.clearMisses();
                  api.freeze(1500);
                }
              } else {
                dropped = f;
                api.miss();
                return;
              }
            }
          }
          // The flight is chosen once every food has moved, so all landing times count from now.
          if (tossedFood) {
            var flight = pickFlight(tossedFood);
            tossedFood.apex = flight.a;
            tossedFood.hangTop = flight.hang;
          }
          // The cat spears the leftmost food on its way down, if that still leaves a fair game.
          catWait--;
          var f0 = foods.filter(function (f) { return f.col === 0; })[0];
          if (f0 && catWait <= 0 && f0.dir < 0 && f0.level === FORK_LEVEL && !f0.held && !f0.hang && Math.random() < 0.4) {
            var hold = 2 + Math.floor(Math.random() * 3);
            if (margin(f0, hold + f0.level) >= 0) {
              f0.held = hold;
              catWait = 14;
            }
          }
        },
        move: function (dir) {
          if (dir === 'left' && chef > 0) {
            chef--;
            return true;
          }
          if (dir === 'right' && chef < COLS.length - 1) {
            chef++;
            return true;
          }
          return false;
        },
        tap: function (x) {
          return this.move(x < api.center('pan-' + chef)[0] ? 'left' : 'right');
        },
        auto: function () {
          var next = null;
          foods.forEach(function (f) {
            if (!next || landing(f) < landing(next)) {
              next = f;
            }
          });
          if (next) {
            chef = next.col;
          }
        },
        render: function (on, blink) {
          var grabbing = foods.some(function (f) { return f.held > 0 && f !== dropped; });
          on(grabbing ? 'cat-grab' : 'cat');
          on('chef-' + chef);
          on((tossed === chef ? 'toss-' : 'pan-') + chef);
          foods.forEach(function (f) {
            if (f === dropped) {
              on('floor-' + f.col);
              if (blink) {
                on('mouse-' + f.col);
              }
            } else if (f.level >= 0 && f.level < LEVELS) {
              on('f-' + f.col + '-' + f.level);
              if (f.held) {
                on('fork');
              }
            }
          });
        },
        interval: function (score) {
          return GW.pace(cfg, score, { slow: 520, normal: 420, fast: 330 });
        },
        afterMiss: function () {
          // The lost food falls back in from the top when it fits.
          var f = dropped;
          dropped = null;
          f.dir = -1;
          f.hang = 0;
          f.held = 0;
          for (var l = 7; l < 16; l++) {
            f.level = l;
            if (margin(f, l) >= 0) {
              break;
            }
          }
        }
      };
    }
  }, cfg);
})();
</script>
</body>
</html>
