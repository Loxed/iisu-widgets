<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Widget</title>
<link rel="stylesheet" href="shared/base.css" data-inline>
<style>
  #root {
    gap: 4cqmin;
  }

  :root.tilt #root > * {
    --depth: 0;
  }

  #scores {
    display: flex;
    gap: 5cqmin;
  }

  #score {
    display: none;
  }

  #stage {
    position: relative;
    flex: 1;
    min-height: 0;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2cqmin;
    text-align: center;
    pointer-events: none;
  }

  #overlay .big {
    font-size: 11cqmin;
    font-weight: 600;
  }

  #overlay .small {
    font-size: 5.5cqmin;
    color: var(--muted);
  }

  #overlay.hidden {
    display: none;
  }

  #overlay .box {
    padding: 3cqmin 6cqmin;
    border-radius: 4cqmin;
    background: var(--bg);
    box-shadow: 0 1cqmin 4cqmin rgba(0, 0, 0, 0.2);
  }

  :root[data-theme="transparent"] #overlay .box {
    background: rgba(0, 0, 0, 0.45);
  }

  @container (min-aspect-ratio: 3/2) {
    #root {
      padding: 5cqmin 8cqmin;
    }

    #score {
      display: inline;
    }
  }
</style>
</head>
<body>
<div id="root">
  <header class="row">
    <span class="title">Snake</span>
    <span id="scores" class="label"><span id="score">Score 0</span><span id="best">Best 0</span></span>
  </header>
  <div id="stage">
    <canvas id="board"></canvas>
    <div id="overlay"><div class="box"><div class="big" id="msg-big"></div><div class="small" id="msg-small"></div></div></div>
  </div>
</div>

<script id="widget-config" type="application/json">{}</script>
<script src="shared/fonts.js" data-inline></script>
<script src="shared/icons.js" data-inline></script>
<script src="shared/runtime.js" data-inline></script>
<script src="shared/input.js" data-inline></script>
<script src="shared/sound.js" data-inline></script>
<script>
(function () {
  var cfg = W.config({
    speed: 'normal',   // slow, normal or fast
    walls: 'solid',    // solid (hitting a wall ends the game) or wrap (come out the other side)
    sound: true
  });

  var SPEEDS = { slow: 150, normal: 110, fast: 75 };
  var BEST_KEY = 'snake:best:' + cfg.walls + ':' + cfg.speed;
  var canvas = W.$('board');
  var ctx = canvas.getContext('2d');

  var cols = 0;
  var rows = 0;
  var cell = 10;
  var offX = 0;
  var offY = 0;
  var snake = [];
  var dir = { x: 1, y: 0 };
  var queue = [];
  var food = null;
  var score = 0;
  var best = W.store.get(BEST_KEY) || 0;
  var state = 'ready';   // ready, playing, paused, over
  var lastStep = 0;
  var colors = {};

  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    colors.fg = cs.getPropertyValue('--fg').trim() || '#fff';
    colors.subtle = cs.getPropertyValue('--subtle').trim() || '#999';
  }

  function blip(f, d) {
    if (cfg.sound) {
      Sound.blip(f, d, 0.3);
    }
  }

  function layout() {
    var stage = W.$('stage');
    var w = stage.clientWidth;
    var h = stage.clientHeight;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var focused = Input.isFocusedView();
    var newRows = focused ? 14 : 10;
    var newCols = Math.max(8, Math.floor(w / (h / newRows)));
    cell = Math.floor(Math.min(w / newCols, h / newRows));
    offX = Math.floor((w - cell * newCols) / 2);
    offY = Math.floor((h - cell * newRows) / 2);
    if (newCols !== cols || newRows !== rows) {
      cols = newCols;
      rows = newRows;
      reset();
    }
    draw();
  }

  function reset() {
    var y = Math.floor(rows / 2);
    snake = [{ x: 4, y: y }, { x: 3, y: y }, { x: 2, y: y }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    placeFood();
    setState('ready');
  }

  function placeFood() {
    var free = [];
    for (var x = 0; x < cols; x++) {
      for (var y = 0; y < rows; y++) {
        if (!snake.some(function (s) { return s.x === x && s.y === y; })) {
          free.push({ x: x, y: y });
        }
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function setState(s) {
    state = s;
    var focused = Input.isFocusedView();
    var big = '';
    var small = '';
    if (!focused) {
      big = '';
      small = 'Focus to play';
    } else if (s === 'ready') {
      big = 'Snake';
      small = 'Press A or tap to start';
    } else if (s === 'paused') {
      big = 'Paused';
      small = 'Press A to continue';
    } else if (s === 'over') {
      big = 'Score ' + score;
      small = (score >= best && score > 0 ? 'New best! ' : '') + 'Press A to play again';
    }
    W.$('msg-big').textContent = big;
    W.$('msg-big').style.display = big ? '' : 'none';
    W.$('msg-small').textContent = small;
    W.$('overlay').classList.toggle('hidden', s === 'playing');
    updateScores();
  }

  function updateScores() {
    W.$('score').textContent = 'Score ' + score;
    W.$('best').textContent = 'Best ' + best;
  }

  function step() {
    if (queue.length) {
      dir = queue.shift();
    }
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (cfg.walls === 'wrap') {
      head.x = (head.x + cols) % cols;
      head.y = (head.y + rows) % rows;
    }
    var hitWall = head.x < 0 || head.y < 0 || head.x >= cols || head.y >= rows;
    var eating = food && head.x === food.x && head.y === food.y;
    var body = eating ? snake : snake.slice(0, -1);
    var hitSelf = body.some(function (s) { return s.x === head.x && s.y === head.y; });
    if (hitWall || hitSelf) {
      blip(110, 0.35);
      if (score > best) {
        best = score;
        W.store.set(BEST_KEY, best);
      }
      setState('over');
      return;
    }
    snake.unshift(head);
    if (eating) {
      score++;
      blip(880, 0.06);
      placeFood();
      updateScores();
    } else {
      snake.pop();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function draw() {
    var w = canvas.width / (window.devicePixelRatio || 1);
    var h = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);

    // Board outline and dot grid.
    ctx.globalAlpha = 0.18;
    ctx.fillStyle = colors.subtle;
    for (var x = 0; x < cols; x++) {
      for (var y = 0; y < rows; y++) {
        ctx.fillRect(offX + x * cell + cell / 2 - 1, offY + y * cell + cell / 2 - 1, 2, 2);
      }
    }
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = colors.subtle;
    ctx.lineWidth = 1;
    ctx.strokeRect(offX + 0.5, offY + 0.5, cols * cell - 1, rows * cell - 1);

    if (food) {
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath();
      ctx.arc(offX + food.x * cell + cell / 2, offY + food.y * cell + cell / 2, cell * 0.36, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = colors.fg;
    snake.forEach(function (s, i) {
      ctx.globalAlpha = i === 0 ? 1 : Math.max(0.35, 0.9 - i / (snake.length * 1.6));
      var pad = Math.max(1, cell * 0.08);
      roundRect(offX + s.x * cell + pad, offY + s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.25);
    });
    ctx.globalAlpha = 1;
  }

  function interval() {
    return Math.max(55, SPEEDS[cfg.speed] - score * 1.5);
  }

  function loop(t) {
    if (state === 'playing') {
      if (!Input.isFocusedView() || document.visibilityState !== 'visible') {
        setState('paused');
      } else if (t - lastStep >= interval()) {
        lastStep = t;
        step();
        draw();
      }
    }
    requestAnimationFrame(loop);
  }

  var DIRS = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };

  Input.on(function (a) {
    if (!Input.isFocusedView()) {
      return;
    }
    if (a.type === 'a') {
      if (state === 'over') {
        reset();
      }
      if (state !== 'playing') {
        setState('playing');
        lastStep = performance.now();
      }
    } else if (a.type === 'start') {
      setState(state === 'playing' ? 'paused' : 'playing');
    } else if (a.type === 'dir') {
      var d = DIRS[a.dir];
      var lastDir = queue.length ? queue[queue.length - 1] : dir;
      // No turning straight back into yourself, and at most 2 turns queued.
      if (d.x !== -lastDir.x || d.y !== -lastDir.y) {
        if (queue.length < 2 && (d.x !== lastDir.x || d.y !== lastDir.y)) {
          queue.push(d);
        }
      }
      if (state === 'ready') {
        setState('playing');
        lastStep = performance.now();
      }
    }
  });

  readColors();
  layout();
  setState('ready');
  window.addEventListener('resize', function () {
    layout();
    if (state !== 'playing') {
      setState(state);
    }
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(layout);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
