<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Music Widget</title>
<link rel="stylesheet" href="shared/base.css" data-inline>
<style>
  /* The picture fills the whole widget, in the tile and in the focused view. */
  #root {
    padding: 0;
    overflow: hidden;
  }

  #pic {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  :root.fit-contain #pic {
    object-fit: contain;
  }

  #empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2cqmin;
    text-align: center;
    padding: 8cqmin;
    font-size: 5.5cqmin;
    color: var(--muted);
  }

  #empty .icon {
    font-size: 16cqmin;
    color: var(--fg);
  }

  /* Status chip in the bottom left corner: track name, "Tap to play", paused. */
  #chip {
    position: absolute;
    left: 4cqmin;
    bottom: 4cqmin;
    max-width: calc(100% - 8cqmin);
    display: flex;
    align-items: center;
    gap: 2cqmin;
    padding: 1.6cqmin 3.2cqmin;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 4.4cqmin;
    text-shadow: none;
    white-space: nowrap;
    transition: opacity 300ms ease;
  }

  #chip.hidden {
    opacity: 0;
  }

  #chip span {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #bars {
    display: inline-flex;
    align-items: flex-end;
    gap: 0.6cqmin;
    height: 3.6cqmin;
    flex: none;
  }

  #bars i {
    width: 0.9cqmin;
    height: 30%;
    border-radius: 1cqmin;
    background: currentColor;
  }

  :root.playing #bars i {
    animation: bar 900ms ease-in-out infinite;
  }

  :root.playing #bars i:nth-child(2) {
    animation-delay: -300ms;
  }

  :root.playing #bars i:nth-child(3) {
    animation-delay: -600ms;
  }

  @keyframes bar {
    0%, 100% {
      height: 30%;
    }

    50% {
      height: 100%;
    }
  }

  @container (min-aspect-ratio: 3/2) {
    #chip {
      font-size: 3.4cqmin;
    }
  }
</style>
</head>
<body>
<div id="root">
  <img id="pic" alt="" style="display: none">
  <div id="empty"></div>
  <div id="chip" class="hidden"><span id="bars"><i></i><i></i><i></i></span><span id="status"></span></div>
</div>

<script id="widget-config" type="application/json">{}</script>
<script src="shared/fonts.js" data-inline></script>
<script src="shared/icons.js" data-inline></script>
<script src="shared/runtime.js" data-inline></script>
<script>
// Page music: a picture or GIF with its own music loop. iiSU only runs a widget while its page is on
// screen, so one of these on each page gives every page its own music.
// Built to start fast, since iiSU may reload the widget every time its page comes back:
// - the music plays through an <audio> element, which starts after a fraction of a second
//   (Web Audio would first decode the whole track, several seconds for a big file);
// - the track and the picture sit at the end of the file (#media-* blocks) and are copied into
//   IndexedDB the first time, so later loads play from there before the page has even finished loading;
// - the position is saved every second, so the music continues where it was.
(function () {
  var cfg = W.config({
    track: '',            // the music: an address, or "#media-track" for a block at the end of the file
    trackName: '',
    trackSize: 0,
    image: '',            // the picture or GIF, same forms
    imageName: '',
    imageSize: 0,
    fit: 'cover',         // cover (fill, cropping the edges) or contain (whole picture)
    volume: 0.7,          // 0 to 1
    fadeIn: 2,            // seconds to fade in when the page shows up
    loop: 'blend',        // blend (overlap the end and the start, for tracks that fade out) or exact
    loopBlend: 8,         // seconds of overlap in blend mode
    showName: true,       // show the track name for a few seconds when it starts
    preview: false        // set by the configurator's preview: wait for a tap instead of playing by itself
  });

  document.documentElement.classList.add('fit-' + cfg.fit);

  var name = (cfg.trackName || 'Music').replace(/\.[^.]+$/, '');
  var POS_KEY = 'pagemusic:pos:' + cfg.trackName + ':' + cfg.trackSize;
  var PAUSE_KEY = 'pagemusic:paused:' + cfg.trackName;
  var paused = cfg.preview || W.store.get(PAUSE_KEY) === true;
  var players = [];       // one <audio>, or two taking turns in blend mode
  var active = null;      // the player currently in charge
  var src = null;
  var failed = '';
  var blocked = false;    // the web view wants a tap before playing
  var chipTimer = null;
  var fade = null;        // { el, from, to, start, ms }

  // ---------- Media: cache in IndexedDB, else read the block at the end of the file ----------
  var parsed = new Promise(function (resolve) {
    if (document.readyState !== 'loading') {
      resolve();
    } else {
      document.addEventListener('DOMContentLoaded', resolve);
    }
  });

  function db() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open('iisu-widgets-media', 1);
      req.onupgradeneeded = function () {
        req.result.createObjectStore('files');
      };
      req.onsuccess = function () {
        resolve(req.result);
      };
      req.onerror = function () {
        reject(req.error);
      };
    });
  }

  function cacheGet(key) {
    return db().then(function (d) {
      return new Promise(function (resolve) {
        var r = d.transaction('files', 'readonly').objectStore('files').get(key);
        r.onsuccess = function () {
          resolve(r.result || null);
        };
        r.onerror = function () {
          resolve(null);
        };
      });
    }).catch(function () {
      return null;
    });
  }

  function cachePut(key, blob) {
    db().then(function (d) {
      d.transaction('files', 'readwrite').objectStore('files').put(blob, key);
    }).catch(function () {});
  }

  // Resolves with an address the page can use for a media option.
  function mediaUrl(key) {
    var v = cfg[key];
    if (!v) {
      return Promise.resolve(null);
    }
    if (v.charAt(0) !== '#') {
      return Promise.resolve(v);
    }
    var cacheKey = 'pagemusic/' + key + '/' + cfg[key + 'Name'] + '/' + cfg[key + 'Size'];
    return cacheGet(cacheKey).then(function (blob) {
      if (blob) {
        return URL.createObjectURL(blob);
      }
      return parsed.then(function () {
        var block = document.getElementById(v.slice(1));
        if (!block) {
          throw new Error('missing ' + v);
        }
        return fetch(block.textContent.trim()).then(function (r) {
          return r.blob();
        }).then(function (b) {
          block.textContent = '';
          cachePut(cacheKey, b);
          return URL.createObjectURL(b);
        });
      });
    });
  }

  // ---------- Picture ----------
  if (cfg.image) {
    mediaUrl('image').then(function (url) {
      W.$('pic').src = url;
      W.$('pic').style.display = '';
      W.$('empty').style.display = 'none';
    });
  } else {
    W.$('empty').innerHTML = W.icon('music') + '<div>' + (cfg.track ? name : 'Choose music and a picture on the configurator page') + '</div>';
  }

  // ---------- Status chip ----------
  function isPlaying() {
    return !!active && !active.paused && !paused;
  }

  function status() {
    document.documentElement.classList.toggle('playing', isPlaying());
    var text = '';
    var stay = true;
    if (failed) {
      text = failed;
    } else if (!cfg.track) {
      text = cfg.image ? 'No music chosen' : '';
    } else if (paused) {
      text = 'Paused, tap to play';
    } else if (blocked) {
      text = 'Tap to play';
    } else if (!isPlaying()) {
      text = 'Loading…';
    } else {
      text = name;
      stay = false;
    }
    W.$('status').textContent = text;
    var show = !!text && (stay || cfg.showName);
    W.$('chip').classList.toggle('hidden', !show);
    clearTimeout(chipTimer);
    if (show && !stay) {
      chipTimer = setTimeout(function () {
        W.$('chip').classList.add('hidden');
      }, 4000);
    }
  }

  // ---------- Playback ----------
  function makePlayer() {
    var a = new Audio();
    a.preload = 'auto';
    a.loop = cfg.loop === 'exact';
    a.src = src;
    a.addEventListener('playing', status);
    a.addEventListener('pause', status);
    a.addEventListener('error', function () {
      failed = 'Could not read the music';
      status();
    });
    return a;
  }

  function fadeVolume(el, to, seconds) {
    fade = { el: el, from: el.volume, to: to, start: performance.now(), ms: Math.max(50, seconds * 1000) };
  }

  function tryPlay(el) {
    var p = el.play();
    if (p && p.catch) {
      p.then(function () {
        blocked = false;
        status();
      }).catch(function (e) {
        if (e && e.name === 'NotAllowedError') {
          blocked = true;
        }
        status();
      });
    }
  }

  function play() {
    paused = false;
    W.store.set(PAUSE_KEY, false);
    if (!src || !active) {
      status();
      return;
    }
    active.volume = 0;
    tryPlay(active);
    fadeVolume(active, cfg.volume, cfg.fadeIn);
    status();
  }

  function pause() {
    paused = true;
    W.store.set(PAUSE_KEY, true);
    players.forEach(function (p) {
      p.pause();
    });
    status();
  }

  // Blend mode: a few seconds before the end, the other player starts from the beginning and they
  // crossfade, which hides the fade-out most game rips end with.
  function tick() {
    if (!active || paused || active.paused) {
      return;
    }
    if (cfg.loop === 'blend' && players.length === 2 && active.duration > 0) {
      var blend = Math.min(cfg.loopBlend, active.duration / 4);
      if (active.currentTime >= active.duration - blend) {
        var next = players[0] === active ? players[1] : players[0];
        next.currentTime = 0;
        next.volume = 0;
        tryPlay(next);
        fadeVolume(next, cfg.volume, blend);
        var old = active;
        active = next;
        setTimeout(function () {
          old.pause();
        }, blend * 1000 + 200);
      }
    }
    // The outgoing player fades out along with the incoming one fading in.
    players.forEach(function (p) {
      if (p !== active && !p.paused && p.duration > 0) {
        var blendOut = Math.min(cfg.loopBlend, p.duration / 4);
        var left = p.duration - p.currentTime;
        p.volume = Math.max(0, Math.min(cfg.volume, cfg.volume * left / blendOut));
      }
    });
    W.store.set(POS_KEY, active.currentTime);
  }

  function animate(now) {
    if (fade) {
      var k = Math.min(1, (now - fade.start) / fade.ms);
      fade.el.volume = Math.max(0, Math.min(1, fade.from + (fade.to - fade.from) * k));
      if (k >= 1) {
        fade = null;
      }
    }
    requestAnimationFrame(animate);
  }

  function start() {
    if (!cfg.track) {
      status();
      return;
    }
    mediaUrl('track').then(function (url) {
      src = url;
      players = cfg.loop === 'blend' ? [makePlayer(), makePlayer()] : [makePlayer()];
      active = players[0];
      // Continue where the music was the last time this page was on screen.
      var pos = W.store.get(POS_KEY);
      if (typeof pos === 'number' && pos > 0) {
        active.currentTime = pos;
      }
      if (!paused) {
        play();
      }
      status();
    }).catch(function (e) {
      failed = 'Could not read the music';
      W.log('pagemusic', String(e));
      status();
    });
  }

  // Page hidden: pause (the position is kept). Page back: fade in again.
  document.addEventListener('visibilitychange', function () {
    if (!active) {
      return;
    }
    if (document.visibilityState === 'visible') {
      if (!paused) {
        play();
      }
    } else {
      W.store.set(POS_KEY, active.currentTime);
      players.forEach(function (p) {
        p.pause();
      });
    }
  });

  window.addEventListener('pagehide', function () {
    if (active) {
      W.store.set(POS_KEY, active.currentTime);
    }
  });

  // A tap plays or pauses (it also counts as the tap the web view may want before sound).
  document.addEventListener('pointerup', function () {
    if (!cfg.track) {
      return;
    }
    if (paused || blocked || !isPlaying()) {
      play();
    } else {
      pause();
    }
  });

  setInterval(tick, 250);
  requestAnimationFrame(animate);
  start();
  status();
})();
</script>
</body>
</html>
