<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Music Widget</title>
<link rel="stylesheet" href="shared/base.css" data-inline>
<style>
  /* The picture fills the whole widget, in the tile and in the focused view. */
  #root {
    padding: 0;
    overflow: hidden;
  }

  #pic {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  :root.fit-contain #pic {
    object-fit: contain;
  }

  #empty {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2cqmin;
    text-align: center;
    padding: 8cqmin;
    font-size: 5.5cqmin;
    color: var(--muted);
  }

  #empty .icon {
    font-size: 16cqmin;
    color: var(--fg);
  }

  /* Status chip in the bottom left corner: track name, or loading. */
  #chip {
    position: absolute;
    left: 4cqmin;
    bottom: 4cqmin;
    max-width: calc(100% - 8cqmin);
    display: flex;
    align-items: center;
    gap: 2cqmin;
    padding: 1.6cqmin 3.2cqmin;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 4.4cqmin;
    text-shadow: none;
    white-space: nowrap;
    transition: opacity 300ms ease;
  }

  #chip.hidden {
    opacity: 0;
  }

  #chip span {
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #bars {
    display: inline-flex;
    align-items: flex-end;
    gap: 0.6cqmin;
    height: 3.6cqmin;
    flex: none;
  }

  #bars i {
    width: 0.9cqmin;
    height: 30%;
    border-radius: 1cqmin;
    background: currentColor;
  }

  :root.playing #bars i {
    animation: bar 900ms ease-in-out infinite;
  }

  :root.playing #bars i:nth-child(2) {
    animation-delay: -300ms;
  }

  :root.playing #bars i:nth-child(3) {
    animation-delay: -600ms;
  }

  @keyframes bar {
    0%, 100% {
      height: 30%;
    }

    50% {
      height: 100%;
    }
  }

  @container (min-aspect-ratio: 3/2) {
    #chip {
      font-size: 3.4cqmin;
    }
  }
</style>
</head>
<body>
<div id="root">
  <img id="pic" alt="" style="display: none">
  <div id="empty"></div>
  <div id="chip" class="hidden"><span id="bars"><i></i><i></i><i></i></span><span id="status"></span></div>
</div>

<script id="widget-config" type="application/json">{}</script>
<script src="shared/fonts.js" data-inline></script>
<script src="shared/icons.js" data-inline></script>
<script src="shared/runtime.js" data-inline></script>
<script>
// Page music: a picture or GIF with its own music loop. iiSU only runs a widget while its page is on
// screen, so one of these on each page gives every page its own music.
// Built to start fast, since iiSU may reload the widget every time its page comes back:
// - the music plays through an <audio> element, which starts after a fraction of a second
//   (Web Audio would first decode the whole track, several seconds for a big file);
// - the track and the picture sit at the end of the file (#media-* blocks) and are copied into
//   IndexedDB the first time, so later loads play from there before the page has even finished loading;
// - the position is saved every second, so the music continues where it was;
// - it always plays by itself: if the web view refuses the <audio> element without a tap, it uses
//   Web Audio instead (see the engines below).
(function () {
  var cfg = W.config({
    track: '',            // the music: an address, or "#media-track" for a block at the end of the file
    trackName: '',
    trackSize: 0,
    image: '',            // the picture or GIF, same forms
    imageName: '',
    imageSize: 0,
    fit: 'cover',         // cover (fill, cropping the edges) or contain (whole picture)
    volume: 0.7,          // 0 to 1
    fadeIn: 2,            // seconds to fade in when the page shows up
    loop: 'blend',        // blend (overlap the end and the start, for tracks that fade out) or exact
    loopBlend: 8,         // seconds of overlap in blend mode
    text: 'none',         // text on the picture: none, name (the track name for a few seconds when it
                          // starts) or all (also loading and errors)
    preview: false        // set by the configurator's preview
  });

  document.documentElement.classList.add('fit-' + cfg.fit);

  var name = (cfg.trackName || 'Music').replace(/\.[^.]+$/, '');
  var POS_KEY = 'pagemusic:pos:' + cfg.trackName + ':' + cfg.trackSize;
  var src = null;          // address of the track (cache or embedded block)

  // ---------- Media: cache in IndexedDB, else read the block at the end of the file ----------
  var parsed = new Promise(function (resolve) {
    if (document.readyState !== 'loading') {
      resolve();
    } else {
      document.addEventListener('DOMContentLoaded', resolve);
    }
  });

  function db() {
    return new Promise(function (resolve, reject) {
      var req = indexedDB.open('iisu-widgets-media', 1);
      req.onupgradeneeded = function () {
        req.result.createObjectStore('files');
      };
      req.onsuccess = function () {
        resolve(req.result);
      };
      req.onerror = function () {
        reject(req.error);
      };
    });
  }

  function cacheGet(key) {
    return db().then(function (d) {
      return new Promise(function (resolve) {
        var r = d.transaction('files', 'readonly').objectStore('files').get(key);
        r.onsuccess = function () {
          resolve(r.result || null);
        };
        r.onerror = function () {
          resolve(null);
        };
      });
    }).catch(function () {
      return null;
    });
  }

  function cachePut(key, blob) {
    db().then(function (d) {
      d.transaction('files', 'readwrite').objectStore('files').put(blob, key);
    }).catch(function () {});
  }

  // Resolves with an address the page can use for a media option.
  function mediaUrl(key) {
    var v = cfg[key];
    if (!v) {
      return Promise.resolve(null);
    }
    if (v.charAt(0) !== '#') {
      return Promise.resolve(v);
    }
    var cacheKey = 'pagemusic/' + key + '/' + cfg[key + 'Name'] + '/' + cfg[key + 'Size'];
    return cacheGet(cacheKey).then(function (blob) {
      if (blob) {
        return URL.createObjectURL(blob);
      }
      return parsed.then(function () {
        var block = document.getElementById(v.slice(1));
        if (!block) {
          throw new Error('missing ' + v);
        }
        return fetch(block.textContent.trim()).then(function (r) {
          return r.blob();
        }).then(function (b) {
          block.textContent = '';
          cachePut(cacheKey, b);
          return URL.createObjectURL(b);
        });
      });
    });
  }

  // ---------- Picture ----------
  if (cfg.image) {
    mediaUrl('image').then(function (url) {
      W.$('pic').src = url;
      W.$('pic').style.display = '';
      W.$('empty').style.display = 'none';
    });
  } else {
    W.$('empty').innerHTML = W.icon('music') + '<div>' + (cfg.track ? name : 'Choose music and a picture on the configurator page') + '</div>';
  }

  // ---------- Playback engines ----------
  // 1. An <audio> element: starts at once while streaming, and lowers iiSU's music (audio focus).
  //    The web view may refuse to start it without a tap (NotAllowedError).
  // 2. Web Audio: the web view lets it start without a tap. It has to decode the track first, so it
  //    decodes the first part of an MP3 to start within a moment, then the whole track in the
  //    background and switches over at the same spot.
  // The widget tries 1, and falls back to 2 as soon as 1 is refused. It never waits for a tap.
  var engine = null;      // 'element' or 'webaudio'
  var failed = '';
  var chipTimer = null;
  var paused = false;     // never set: the music always plays while the page is on screen
  var startPos = 0;

  var el = { players: [], active: null, fade: null };
  var wa = { ctx: null, master: null, full: null, pass: null, passes: [] };

  function savePos(p) {
    if (typeof p === 'number' && isFinite(p)) {
      W.store.set(POS_KEY, p);
    }
  }

  function isPlaying() {
    if (paused) {
      return false;
    }
    if (engine === 'element') {
      return !!el.active && !el.active.paused;
    }
    if (engine === 'webaudio') {
      return !!wa.pass && wa.ctx && wa.ctx.state === 'running';
    }
    return false;
  }

  // ---------- Status chip ----------
  function status() {
    document.documentElement.classList.toggle('playing', isPlaying());
    var text = '';
    var stay = true;
    if (failed) {
      text = failed;
    } else if (!cfg.track) {
      text = cfg.image ? 'No music chosen' : '';
    } else if (!isPlaying()) {
      text = 'Loading…';
    } else {
      text = name;
      stay = false;
    }
    W.$('status').textContent = text;
    // With text: none nothing shows: the picture stays clean, the music just fades in once loaded.
    var show = !!text && (cfg.text === 'all' || (cfg.text === 'name' && !stay));
    W.$('chip').classList.toggle('hidden', !show);
    clearTimeout(chipTimer);
    if (show && !stay) {
      chipTimer = setTimeout(function () {
        W.$('chip').classList.add('hidden');
      }, 4000);
    }
  }

  // ---------- Engine 1: <audio> elements ----------
  function makePlayer() {
    var a = new Audio();
    a.preload = 'auto';
    a.loop = cfg.loop === 'exact';
    a.src = src;
    a.addEventListener('playing', status);
    a.addEventListener('pause', status);
    return a;
  }

  function elFade(player, to, seconds) {
    el.fade = { el: player, from: player.volume, to: to, start: performance.now(), ms: Math.max(50, seconds * 1000) };
  }

  function elStart() {
    el.players = cfg.loop === 'blend' ? [makePlayer(), makePlayer()] : [makePlayer()];
    el.active = el.players[0];
    el.active.currentTime = startPos;
    el.active.volume = 0;
    var p = el.active.play();
    return (p && p.then ? p : Promise.resolve()).then(function () {
      engine = 'element';
      elFade(el.active, cfg.volume, cfg.fadeIn);
      status();
    });
  }

  function elTick() {
    var a = el.active;
    if (!a || paused || a.paused) {
      return;
    }
    if (cfg.loop === 'blend' && el.players.length === 2 && a.duration > 0) {
      var blend = Math.min(cfg.loopBlend, a.duration / 4);
      if (a.currentTime >= a.duration - blend) {
        var next = el.players[0] === a ? el.players[1] : el.players[0];
        next.currentTime = 0;
        next.volume = 0;
        next.play().catch(function () {});
        elFade(next, cfg.volume, blend);
        el.active = next;
        setTimeout(function () {
          a.pause();
        }, blend * 1000 + 200);
      }
    }
    el.players.forEach(function (p) {
      if (p !== el.active && !p.paused && p.duration > 0) {
        var out = Math.min(cfg.loopBlend, p.duration / 4);
        p.volume = Math.max(0, Math.min(cfg.volume, cfg.volume * (p.duration - p.currentTime) / out));
      }
    });
    savePos(el.active.currentTime);
  }

  // ---------- Engine 2: Web Audio ----------
  function waFadeMaster(to, seconds) {
    var t = wa.ctx.currentTime;
    wa.master.gain.cancelScheduledValues(t);
    wa.master.gain.setValueAtTime(wa.master.gain.value, t);
    wa.master.gain.linearRampToValueAtTime(to, t + Math.max(0.05, seconds));
  }

  function decode(data) {
    return new Promise(function (resolve, reject) {
      wa.ctx.decodeAudioData(data, resolve, reject);
    });
  }

  // Position in the track of the pass playing now.
  function waPos() {
    var p = wa.pass;
    return p ? p.offset + (wa.ctx.currentTime - p.at) : 0;
  }

  // Plays buffer from offset at time at. Only the full track loops.
  function waPass(buffer, offset, at, fadeIn) {
    var ctx = wa.ctx;
    var s = ctx.createBufferSource();
    var g = ctx.createGain();
    s.buffer = buffer;
    s.connect(g);
    g.connect(wa.master);
    var d = buffer.duration;
    var full = buffer === wa.full;
    var blend = full && cfg.loop === 'blend' ? Math.min(cfg.loopBlend, d / 4) : 0;
    if (fadeIn > 0) {
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(1, at + fadeIn);
    } else {
      g.gain.setValueAtTime(1, at);
    }
    if (full && cfg.loop === 'exact') {
      s.loop = true;
    } else if (blend) {
      g.gain.setValueAtTime(1, at + d - offset - blend);
      g.gain.linearRampToValueAtTime(0, at + d - offset);
    }
    s.start(at, Math.max(0, Math.min(offset, d - 0.1)));
    var pass = { src: s, gain: g, at: at, offset: offset, buffer: buffer, next: blend ? at + d - offset - blend : Infinity, blend: blend };
    wa.passes.push(pass);
    wa.pass = pass;
    return pass;
  }

  function waStopPass(pass, seconds) {
    var t = wa.ctx.currentTime;
    pass.gain.gain.cancelScheduledValues(t);
    pass.gain.gain.setValueAtTime(pass.gain.gain.value, t);
    pass.gain.gain.linearRampToValueAtTime(0, t + seconds);
    setTimeout(function () {
      try {
        pass.src.stop();
      } catch (e) {}
    }, seconds * 1000 + 100);
  }

  function waStart() {
    engine = 'webaudio';
    var AC = window.AudioContext || window.webkitAudioContext;
    wa.ctx = new AC();
    wa.master = wa.ctx.createGain();
    wa.master.gain.value = 0;
    wa.master.connect(wa.ctx.destination);
    wa.ctx.onstatechange = status;
    wa.ctx.resume().catch(function () {});
    var mp3 = /\.mp3$/i.test(cfg.trackName);
    return fetch(src).then(function (r) {
      return r.arrayBuffer();
    }).then(function (data) {
      // MP3 frames stand alone, so the first part decodes on its own: play it while the rest decodes.
      var PART = 1.5 * 1048576;
      if (!mp3 || data.byteLength <= PART * 1.5) {
        return decode(data).then(function (full) {
          wa.full = full;
          waBegin(full, startPos % full.duration);
        });
      }
      return decode(data.slice(0, PART)).then(function (part) {
        var perSec = PART / part.duration;
        if (startPos + 20 < part.duration) {
          waBegin(part, startPos);
          return null;
        }
        // Resuming further in: decode enough to reach that spot.
        var need = Math.min(data.byteLength, Math.ceil((startPos + 40) * perSec));
        return decode(data.slice(0, need)).then(function (longer) {
          waBegin(longer, Math.min(startPos, longer.duration - 5));
        });
      }).then(function () {
        return decode(data);
      }).then(function (full) {
        // Switch to the whole track at the same spot, with a short crossfade.
        wa.full = full;
        var old = wa.pass;
        var pos = waPos();
        if (pos >= full.duration - 1) {
          pos = 0;
        }
        waPass(full, pos, wa.ctx.currentTime + 0.05, 0.3);
        if (old) {
          waStopPass(old, 0.3);
        }
      });
    });
  }

  function waBegin(buffer, offset) {
    waPass(buffer, offset, wa.ctx.currentTime + 0.05, 0);
    if (!paused) {
      waFadeMaster(cfg.volume, cfg.fadeIn);
    }
    status();
  }

  function waTick() {
    if (!wa.pass || !wa.ctx || wa.ctx.state !== 'running') {
      return;
    }
    var p = wa.pass;
    // Blend loop: the next pass starts before this one ends.
    if (p.next !== Infinity && wa.ctx.currentTime > p.next - 2) {
      waPass(wa.full, 0, p.next, p.blend);
    }
    savePos(p.buffer === wa.full ? waPos() % wa.full.duration : waPos());
  }

  // ---------- Common controls ----------
  function play() {
    paused = false;
    if (engine === 'element' && el.active) {
      el.active.volume = 0;
      el.active.play().catch(function () {});
      elFade(el.active, cfg.volume, cfg.fadeIn);
    } else if (engine === 'webaudio' && wa.ctx) {
      wa.master.gain.setValueAtTime(0, wa.ctx.currentTime);
      wa.ctx.resume().then(function () {
        waFadeMaster(cfg.volume, cfg.fadeIn);
        status();
      }).catch(function () {});
    }
    status();
  }

  function stopForNow() {
    if (engine === 'element') {
      if (el.active) {
        savePos(el.active.currentTime);
      }
      el.players.forEach(function (p) {
        p.pause();
      });
    } else if (engine === 'webaudio' && wa.ctx) {
      waTick();
      wa.ctx.suspend().catch(function () {});
    }
  }

  function start() {
    if (!cfg.track) {
      status();
      return;
    }
    mediaUrl('track').then(function (url) {
      src = url;
      var pos = W.store.get(POS_KEY);
      startPos = typeof pos === 'number' && pos > 0 ? pos : 0;
      if (cfg.preview) {
        // The configurator preview goes straight to Web Audio (no tap needed there either).
        return waStart();
      }
      return elStart().catch(function (e) {
        // Refused without a tap: use Web Audio instead of asking for one.
        el.players.forEach(function (p) {
          p.removeAttribute('src');
          p.load();
        });
        el.players = [];
        el.active = null;
        W.log('pagemusic: audio element refused (' + (e && e.name) + '), using Web Audio');
        return waStart();
      });
    }).then(status).catch(function (e) {
      failed = 'Could not read the music';
      W.log('pagemusic', String(e));
      status();
    });
  }

  function animate(now) {
    var f = el.fade;
    if (f) {
      var k = Math.min(1, (now - f.start) / f.ms);
      f.el.volume = Math.max(0, Math.min(1, f.from + (f.to - f.from) * k));
      if (k >= 1) {
        el.fade = null;
      }
    }
    requestAnimationFrame(animate);
  }

  // Page hidden: stop for now (the position is kept). Page back: fade in again.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      if (!paused) {
        play();
      }
    } else {
      stopForNow();
    }
  });

  window.addEventListener('pagehide', stopForNow);

  setInterval(function () {
    if (engine === 'element') {
      elTick();
    } else if (engine === 'webaudio') {
      waTick();
    }
    status();
  }, 250);
  requestAnimationFrame(animate);
  start();
  status();
})();
</script>
</body>
</html>
